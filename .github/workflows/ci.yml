name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: controle_geral_api_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d controle_geral_api_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/controle_geral_api_test?schema=public
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/controle_geral_api_test?schema=public
      CORS_ORIGINS: http://localhost:3000
      RATE_LIMIT_MAX: 1000
      RATE_LIMIT_WINDOW: 1 minute
      BODY_LIMIT: 1048576
      LOG_LEVEL: error
      OTEL_ENABLED: false
      GIT_SHA: ci
      SERVICE_NAME: controle-geral-api
      APP_VERSION: 0.1.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run prisma:migrate:deploy
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run test:e2e
      - run: npm run test:coverage
      - run: npm run build
